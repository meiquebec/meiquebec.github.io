# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@kirigami/kirigami/kirigami.schema.json

kirigami:
  project:     Mouvement Étudiant Indépendantiste
  baseurl:     https://mouvei.quebec
  root:        src
  banner:      banner.txt
  author:      Maxime Larrivée-Roy
  email:       mouvement.ei@gmail.com
  repo:        https://github.com/meiquebec/meiquebec.github.io
  description: >-
    Le Mouvement Étudiant Indépendantiste (MÉI) est une organisation parapluie
    regroupant plus d’une vingtaine de comités souverainistes dans les cégeps et
    universités à travers tout le Québec.

  # Réseaux sociaux : liens du menu et du pied de page, et « sameAs » du JSON-LD.
  instagram:   https://www.instagram.com/mouv.ei/
  youtube:     https://www.youtube.com/@mouv_ei/
  facebook:    https://www.facebook.com/mouvei/

  boutique:    https://50plus1.quebec/collections/collection-mei-mouvement-etudiant-independantiste
  formulaire:  https://docs.google.com/forms/d/1lmEXvZz6tyVQA2FYvYILfyLLc0NhkWgiAepPkSg5w-U

  # Carte des comités. La clé Google n'est PAS ici : elle vient de
  # secrets.local.yaml (« carte: … »), écrit par la CI, par Kiri Studio ou à la
  # main (voir docs/SCRIPTS.md §3). Sans clé, la carte n'est pas affichée.
  carte:
    mapid: 7a4f282a9b2f394eb458f2ee


seo:
  lang:            fr-CA
  titleFormat:     "{title} | {project}"
  titleFormatHome: "{project}"
  image:           images/ogimage.webp
  logo:            images/ogimage.webp
  address:
    streetAddress:   82 Sherbrooke St W 2e étage
    addressLocality: Montréal
    addressRegion:   QC
    postalCode:      H2X 1X3
    addressCountry:  CA


prepros:
  before:   _templates/header.php
  after:    _templates/footer.php
  format:   true
  network:  true   # requis par scripts/preparer-comites.php (géocodage, Instagram)
  includes:
    - _plugins/md.plugins.php
    - _plugins/comites.php
    - _plugins/fonctions.php


image:
  format: webp
  source: assets/images
  dest:   images


export:
  path: dist


scripts:
  - name:    preparer-comites
    trigger: before-build
    mount:   [secrets.local.yaml]
    # Relancé dès que la liste change (kiri serve, aperçu de Kiri Studio).
    watch:   [src/_data/comites/comites.yaml]


tasks:

  - name:  js-core
    type:  esbuild
    entry: scripts/mei.core.js

  - name:  scss-core
    type:  sass
    entry: styles/mei.core.scss

  # Outil interne de _mapstyle/ : jamais injecté dans les pages publiques.
  - name:  js-mapstyle
    type:  esbuild
    entry: scripts/mei.mapstyle.js
    head:  false


# Ce que l'équipe du MÉI édite dans Kiri Studio : chaque fichier de _data/ que
# les pages chargent. Les caches générés n'y apparaissent pas.
studio:
  images: assets/images
  exclude:
    - src/_data/comites/geocodage.json
    - src/_data/comites/instagram.json
  labels:
    src/_data/equipe/equipe.yaml:   Équipe
    src/_data/medias/articles.yaml: Articles
    src/_data/comites/comites.yaml: Comités
  # Clé saisie une fois dans Studio (« Clés du site »), gardée sur le poste :
  # l'aperçu géocode lui-même les nouveaux comités.
  secrets:
    file: secrets.local.yaml
    keys:
      geocodage: Clé de géocodage Google (Geocoding API)
      carte:     Clé de la carte Google (Maps JavaScript API)
  # Ce que l'aperçu a calculé part avec la publication : la CI n'a plus à le
  # refaire (et la photo Instagram est prise depuis le poste de l'équipe).
  publish:
    - src/_data/comites/geocodage.json
    - src/_data/comites/instagram.json
    - assets/images/comites/instagram/*.jpg
