name: Build & Deploy

env:
  TZ: America/Toronto

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write      # recommit des fichiers régénérés (caches des comités, images)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      # Clés Google, jamais commitées (voir docs/SCRIPTS.md) : « geocodage » pour
      # scripts/preparer-comites.php, « carte » pour la page des comités. Tant
      # que la clé n'est pas séparée en deux, GOOGLE_API_KEY sert aux deux.
      # « obligatoire » : en CI, une nouvelle adresse sans clé fait échouer le
      # build au lieu de publier une carte incomplète. Fichier ignoré par git.
      - name: Clés Google
        shell: bash
        env:
          GEOCODAGE: ${{ secrets.GEOCODING_API_KEY || secrets.GOOGLE_API_KEY }}
          CARTE: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          printf 'geocodage: "%s"\ncarte: "%s"\nobligatoire: true\n' "$GEOCODAGE" "$CARTE" > secrets.local.yaml

      - name: KiriBuild
        uses: php-kirigami/kiribuild@v2
        with:
          node-version: '24'

      - name: Commit regenerated files
        shell: bash
        run: |
          rm -f secrets.local.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "kirigami[bot]"
            git config user.email "kirigami-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: update generated files [skip ci]"
            git push
          else
            echo "Nothing to commit."
          fi

      # Clés publiées avec le site, comme avant la migration : l'aperçu de Kiri
      # Studio et un clone frais les lisent ici (comites_cles() dans
      # src/_plugins/comites.php), sans rien saisir. Format OBF (JSON → base64
      # → ROT13 → gzip sans ses deux octets d'en-tête).
      - name: Clés publiées
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MAP_ID: ${{ secrets.MAP_ID }}
        run: |
          printf '{"GOOGLE_API_KEY":"%s","MAP_ID":"%s"}' "$GOOGLE_API_KEY" "$MAP_ID" > /tmp/cles.json
          B64="$(base64 -w 0 /tmp/cles.json)"
          ROT="$(printf '%s' "$B64" | tr 'A-Za-z' 'N-ZA-Mn-za-m')"
          printf '%s' "$ROT" | gzip -9 -c > /tmp/cles.gz
          dd if=/tmp/cles.gz of=dist/bt1oh97j7X.bin bs=1 skip=2 status=none
          rm -f /tmp/cles.json /tmp/cles.gz

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
