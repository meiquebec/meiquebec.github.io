name: Build & Deploy

env:
  TZ: America/Toronto

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write      # recommit des fichiers régénérés (caches des comités, images)
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Checkout
        uses: actions/checkout@v7

      # Clé de géocodage pour scripts/preparer-comites.php (voir docs/SCRIPTS.md).
      # « obligatoire » : en CI, une nouvelle adresse sans clé fait échouer le
      # build au lieu de publier une carte incomplète. Fichier ignoré par git.
      - name: Clé de géocodage
        shell: bash
        env:
          GEOCODING_API_KEY: ${{ secrets.GEOCODING_API_KEY }}
        run: |
          printf 'geocodage: "%s"\nobligatoire: true\n' "$GEOCODING_API_KEY" > secrets.local.yaml

      - name: KiriBuild
        uses: php-kirigami/kiribuild@v2
        with:
          node-version: '24'

      - name: Commit regenerated files
        shell: bash
        run: |
          rm -f secrets.local.yaml
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "kirigami[bot]"
            git config user.email "kirigami-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: update generated files [skip ci]"
            git push
          else
            echo "Nothing to commit."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
