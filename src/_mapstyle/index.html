<!--

    partir des variables CSS du site. À coller ensuite dans la console Google
    Cloud (Map ID). Jamais exporté (dossier « _ »). Faire « npm run build »,
    puis ouvrir ce fichier dans le navigateur.
-->
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../styles/mei.core.min.css">
    <script src="../scripts/mei.mapstyle.min.js"></script>
    <title>Style de la carte | Mouvement Étudiant Indépendantiste</title>
</head>
<body>
    <main>
        <section>
            <div>
                <h2>Télécharger la feuille de style de la carte</h2>
                <button onclick="downloadMapStyle()">Télécharger</button>
            </div>
        </section>
    </main>
</body>
</html>
